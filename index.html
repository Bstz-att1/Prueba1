<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager SPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script type="module">
    // Dual bootstrap:
    // - Vite dev/build: usa /src/main.js
    // - Static server (npx serve sobre carpeta Frontend): usa ./src/standalone.js
    const isViteRuntime =
      !!window.__vite_is_modern_browser ||
      location.port === '5173' ||
      /vite/i.test(navigator.userAgent);

    const script = document.createElement('script');
    script.type = 'module';
    script.src = isViteRuntime ? '/src/main.js' : './src/standalone.js';
    document.body.appendChild(script);
  </script>
</body>
</html>
